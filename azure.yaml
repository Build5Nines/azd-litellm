name: litellm
metadata:
  subscription: ${AZURE_SUBSCRIPTION_ID}
  location: ${AZURE_LOCATION}
  resource_group: ${AZURE_RESOURCE_GROUP}

infra:
  bicep: ./infra/main.bicep
  parameters:
    - name: containerMinReplicaCount
      value: 0
    - name: containerMaxReplicaCount
      value: 1

services:
  litellm:
    project: ./src/litellm
    host: containerapp
    language: python
    docker:
      context: ./
      path: DOCKERFILE
      remoteBuild: true
    resources:
      cpu: 1
      memory: 2Gi
